 MON_GATHERING_STORM_DESC:0 "Монголия - молодая никем не признанная страна, которая отвалилось от еле живого Китая. На пороге нового времени перед молодым государством стоит не простая задача - доказать миру, что Монголия еще может вернуться на мировую арену!"  
 MON_Final_desc:0 "Танну-Тува так же как и мы отделилась от Китайской империи пологаясь на помощь России. Объединив наши народы мы выстоим перед надвигающейся бурей!"
 MON_rise_politic_desc:0 "Перед нами стот задача - уничтожить антисоветские группировки в нашей стране и поставить монгольскую индустрию на военные рельцы."
 MON_Smuta_desc:0 "В нашей стране орудуют нелояльные нам церковные группировки. Стоит начать кампанию по отловле и дальнейшая казнь тунеядцев."

 
 

