napoleon.1.t:0 "Тень Бонапарта над Бенилюксом"
napoleon.1.desc:0 "Спустя более чем век после заката Первой Империи, Наполеон VI готов переписать историю. На экстренной пресс-конференции в Париже французский монарх открыто заявил права на Бенилюкс. «Земли, где пролилась кровь наших великих предков, не могут принадлежать марионеткам», — отрезал Император, намекая на реванш за поражение 1815 года. Мир замер в ожидании новой тотальной войны на континенте."
napoleon.1.a:0 "История повторяется"

