 irish.7.b: "Северная Ирландия всегда была английской землей!"
 irish.7.d: "Правительство Ирландии требует восстановить историческую справделивость, вернув им Ольстер. Что же мы выберем?"
 irish.8: "Британская корона согласилась на наш ультимутум."
 irish.8.t: "Британская корона согласилась на наш ультимутум."
