USA_mobilization_desc:0 "Нарастающее напряжение на мировой арене вынуждает нас провести ускоренную мобилизацию экономики, для обеспечения мира во всем мире!"

HUN_glory_republic:0 "Интеграция исторических земель"
HUN_glory_republic_desc:0 "Наша родина за всю свою долгую жизнь лишь лишалась своих земель, подвергаясь унижению от соседних государств. Пришло время перечеркнуть эту черную страницу нашей истории и вернуть былое величие Венгрии!"

obuchenie.1.t:0 "Сводка"
