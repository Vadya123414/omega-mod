ROM_start_ind_desc:0 "Основа каждой экономики - хорошая инфраструктура!"
ROM_buldind_plans_desc:0 "Заложив фундамент для экономического роста, нам стоит ввести четкий график!"
ROM_civilain_expansion_desc:0 "В нашей стране много предпреимчевых людей, которые готовы исполнить план по индустриализации Румынии. Мы их поддержим."
ROM_ferms_gurant_desc:0 "Румыния - это аграрная страна, в которой все держится на фермерах. Гарантировав их социальную позицию, мы получим их поддержку."
ROM_ready_to_war_desc:0 "Мы находимся между молотом и наковальней. Не стоит медлить с выбором сторон конфликта."
ROM_sup_SOV_desc:0 "Советский союз готов поддержать нас своими советниками и солдатами, для защиты нашего суверинитета."
ROM_sup_ENG_desc:0 "Англия находится довольно далеко от нас, что усложнит транспортировку войск. Поэтому британскими стратегами был разработан новый план по удержанию нашей страны путем постройкой бункеров."
ROM_sup_GER_desc:0 "Третий рейх нуждается в нашей нефти, и для этого их правительство готово построить нам пару военных заводов."
ROM_secure_balkan_desc:0 "География - это судьба. Наша дислокация очень неудобна для других стран. Поэтому мы будет защищать нашу независимость!"
ROM_resources_desc:0 "Трансильвания очень богата на железную руду. Начав обширную добычу руды, мы обеспечим себя ресурсами первой необходимости."
ROM_oil_company_desc:0 "Наша экономику очень зависима от экспорта нефти за рубеж. Не будем же отходить от давней традиции."
ROM_def_oil_desc:0 "В связи с нарастающей угрозой от наших соседей, будем логично заранее подготовить воздушную оборону нефтянных залеж."
FRA_victors_of_wwi_1: "Победители Великой войны"

