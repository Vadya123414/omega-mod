HON_railways_desc:0 "Наша инфраструктура стара и подобна африканской. Надо исправить данный недуг."
HON_another_capital_desc:0 "Привлекая иностранный капитал, мы сможем расширить число рабочих мест."
HON_economic_plan_desc:0 "Вводя двухлений план мы планируем максимальной индустриализироваться."
HON_ferms_desc:0 "Первым делом надо решить вопрос с фермирами. Вложась в эту отрасль мы улучшим жизгь граждан."
HON_cofee_desc:0 "Кофейные плантаторы занимают весомый процент нашей экономики. Инвистирую в их деятельность мы сможем получить с этого выгоду."
HON_population_desc:0 "Демография нашей страны очень печально выглядит на фоне других. Введя социальные выплаты многодетным семьям, мы сможем улучшить наш рост населения."
HON_civilian_way_desc:0 "Делая ставку на гражданскую промышленность, мы значительно быстро сможем индустриализироваться!"
HON_civ1_desc:0 "В нашей стране стоит проблема нехватки рабочих мест. Расширяя строительные компании мы сможем решить данную проблему."
HON_civ2_desc:0 "Текстиль хорошо продается на зарубежном рынке."
HON_military_way_desc:0 ""Делая ставку на военную промышленность, мы значительно быстро сможем индустриализироваться!"
HON_mil1_desc:0 "Для защиты нашей независимости, мы должны начать производство военной продукции."
HON_mil2_desc:0 "Танки - острие копья любой армии!"
HON_dockyard_way_desc:0 "Делая ставку на судостроительную промышленность, мы значительно быстро сможем индустриализироваться!"
HON_doc1_desc:0 "Мы практически беззащитны в воде. Стоит начать с малых кораблей охранения."
HON_doc2_desc:0 "В Европе бушует война, которая может коснуться нашего континента. Надо присечь угрозу с моря!"
HON_research_desc:0 "Образованный гражданин - продуктивный гражданин!"
HON_race_desc:0 "В нашей стране находится множество народов которых еще предстоит нам объединить под единым флагом."
HON_start_ind_desc:0 "Эксперты разработали новые способы развития нашей экономики."
HON_new_cource_desc:0 "Перед нами стоит не простой выбор в политическом курсе нашего государства в надвигающейся буре."
HON_comi_desc:0 "Теория о классовой борьбе достигли берегов Америки, и наш рабочий класс собирается тоже бороться за права рабочих!"
HON_comi_groups_desc:0 "Рабочие после смены собираются в коммунистические группы и устраивают саботажи на предприятих. Учредив их на официльном уровне, мы сможем популизировать идеи маркса в массы."
HON_SOV_alliance_desc:0 "СССР - первая социалистическая страна, которая доказала всему миру успех коммунистических идеалов. Встав плечом к плечу с ним, мы сможем победить в грядущей войне."
HON_SOV_ind_desc:0 "Раскулачив зажравших арисократов, мы получим новые строительные места для постройки нашей идилии."
HON_SOV_bolscivizm_desc:0 "Пришло время преобразоваться в советскую республику. Слава рабочей кресьянской революции!"
HON_SOV_red_army_desc:0 "Советскую армию боятся многие западные страны. Скопируя их модель, мы сможем значительно продвинуться к нашей победе!"
HON_democratic_path_desc:0 "Демократия - единственная рабочая форма правления, которая доказала свою работоспособность временем. Нам не стоит сходить с данного курса."
HON_usa_groups_desc:0 "США стремиться к господству в американском континете. Нету ничего плохого, если мы примкнем к ним."
HON_order_desc:0 "Любые идеологические группировки лишь саботируют наш государственный строй. Мы не пойдем с ними на компромисс."
HON_USA_eco_desc:0 "Торговля с США выгодна взаимно обоим нам."
HON_FRA_eco_desc:0 "Торговля с Францией выгодна взаимно обоим нам."
HON_ENG_eco_desc:0 "Торговля с Британией выгодна взаимно обоим нам."
HON_USA_money_desc:0 "Соединенные штаты готовы инвестировать в нашу молодую экономику, чтобы мы могли скорее оправиться от великой депрессии."
HON_new_farics_desc:0 "Западные страны согласны на экономическую помщь нам на помощь в грядущей войне."
HON_new_resource_desc:0 "Геолоки нашли в наших землях новые залежи ресурсов. Инвистируя в их замысел, мы сможем обоготиться на этом."
HON_alliance_desc:0 "Наши союзники - побелители первой мировой войны. Нет сомнения брать пример с них."
HON_air_plance_desc:0 "Господство в воздухе - ключ к победе."
HON_ships_desc:0 "У стран союзников есть много устраревших проектов линкоров, которые им не пригодились. Выкупив их наработки, мы пострим свой собвственный вмф."
HON_fasicm_desc:0 "Демократия и коммунизм - не наш путь. Лишь в расовой борьбе есть единство нации!"
HON_fasi_groups_desc:0 "Группы из право настроенных лиц занимаются агитацией национализма. Интегрировав их в наше дело, мы полчим больше сторонников."
HON_GER_allience_desc:0 "Третий рейх - является гегемоном среди фашистких стран. Заручась их поддержкой, мы покажем нашу решительность в мировой борьбе за право на жизнь."
HON_GER_ind_desc:0 "Мы получили несколько военных предприятий со стороны нацистов. Это доказательство того, что они видят в нас арийцев!"
HON_GER_uni_desc:0 "Пришло время для 'бананового' путча и становления нового режима в Америке!"
HON_fas_arm_desc:0 "Радикальные националисты - это отличные бойцы на линии фронта. Создав армию по образцу вермахта, мы сможем покорить всю Америку."
HON_end_USA_desc:0 "Время пришло для решительных мер. Господство США ставит под угрозой нашу государственную безопасность и суверинитет."
HON_attack_MEX_desc:0 "План Север заключается в быстром захвате Мексики и подготовкой к борьбе с США."
HON_attack_USA_desc:0 "Корумпированное правительство США не способно защитить свои интересы. Мы же в силах положить этому конец."
HON_attack_COL_desc:0 "План Север заключается в быстром захвате южных соседей и подготовкой к борьбе с остальным югом."
HON_attack_south_ame_desc:0 "Никого компромисса со слабаками. Только господство."
HON_our_americs_desc:0 "GG WP, solo"

