RUS_krum_desc:0 "Передав крым нашим украинским партнерам, мы сможем добиться их расположенности."
RUS_military:0 "Военные учения"
RUS_military_desc:0 "У молодых стран снг нету четко сформулированной военной доктрины. Проведя учения мы сможем укрепить нашу обороноспособность."
RUS_oirat:0 "Вопрос алтайского края"
RUS_oirat_desc:0 "В алтайском крае живут многожество народов азии. Администрация Казахстана сможет лучше распорядиться этими землями."


SOV_democratic_referandum_desc:0 "Большивики показали миру, что идеи марскизма были ошибочными. Пора реализовать нашу собственную демократию!"
RUS_not_vibor_desc:0 "Идеи либерализма не подходят нашему русскому народу. Нам нужен сильное правительство и лидер."
RUS_GER_cooperation_desc:0 "Третий рейх на данный момент оказывает значительное влияние на Европу. Сотрудничая с ними мы обеспечим себе будущее!"
RUS_GER_tanks_desc:0 "Немецкие инновации в области танкостроении значительно впереди наших. Нам стоит научиться у них производить свою бронетехнику."
RUS_GER_submarine_desc:0 "На данный момент подводные лодки являются самым оптимальным вариантом для воздействия на море."
RUS_GER_economi_desc:0 "Немцы научились производить каучук с нефтеперерабатывающих заводов, что значительно снижает зависимоть от западных аналогов."
SOV_expansion_desc:0 "Пора вернуть утерянные земли России!"
SOV_attack_baltic_desc:0 "В ходе первой мировой войны мы потеряли контроль над Балтикой, пора исправить это недорозумение."
SOV_attack_finland_desc:0 "Граница с Финлядией очень близко находится с Санкт-Петербургом, нашей второй столицей. Для гарантии безопасности стоит сдвинуть границу!"
SOV_attack_poland_desc:0 "Украинцы и Белорусы по сей день подвергаются расовой сегрегации со стороны поляк. Мы вернем их в родную гавань, хотят они этого или нет."
RUS_liberate_desc:0 "Русский народ очень долго находился под властью авторитарных лидеров, из-за чего у наших людей образовался 'минтелитет послушания'. Пришло время нам построить свой собственный рай на земле!"
RUS_reconstruction_desc:0 "Хоть мы и выйграли большевизм, но с этого пришли и национальные проблемы в стране. Нам предстоит сделать выбор во внутренней политике страны."
RUS_unifucation_desc:0 "Решив локальные протесты и забостовки путем силовиков, мы сможем удержать все наши земли под наши управлением. Россия едина и неделима!"
RUS_raspad_desc:0 "Стоит признать, что наша бюрократическая аппаратура не справляется с грамотным управление обширных земель. Наделив несколько субъектов широкой автономностью, мы облегчим себе работу."
RUS_UKR_desc:0 "Украинцы - наши братья меньшие. История наделила их отличием от нашей культуры, из-за чего возникали межнациолнальные конфликты на данной почве. Пора дать им автономность."
RUS_BLR_desc:0 "Белорусы - наши братья меньшие. Мы очень крепко связаны историей и культурой, но среди них веет духом сепаратизма. Пора дать им автономность."
RUS_KAZ_desc:0 "Казахи - наши братья меньшие. В ходе расширения на Сренюю Азию, нам удалось покороить их ханства и присоединить к себе. Пора дать им автономность."
RUS_moscow_pact_desc:0 "России угатован свой собственный путь самим господом. Мы будем сами себя вести в светлое будущее!"
RUS_FIN_friend_desc:0 "В прошлом мы освободили финов от шведского гнета, но в ходе гражданской войны мы потеряли над Финлядией контроль. Нам стоит наладить с ними тесный контакт."
RUS_Pribaltic_friend_desc:0 "Балтийские страны еще молоды, чтобы самим определять свой политический курс в мире. Мы возьем их под свое крыло."
RUS_east_friend_desc:0 "Ближний Восток - не самый стабильный регион на нашей планете, но в ней есть региональные страны, которые влияют на весь регион. Стоит с ними поладить."
RUS_our_friend_desc:0 "Чтобы защитить нашу страну и наших союзников, наши экономисты разработали план, по которому мы сможем нарастить военную машину за считанные месяцы."
RUS_denazizm_desc:0 "Фашизм полностью противоречит нашей политике. Мы не стерпем угнетения других народов! Пора провести специальную военную операцию."
RUS_alliance_desc:0 "Из-за гражданской войны мы потеряли прежние дипломатические связи с западными странами. Вернувшись на мировую арену, мы должны в первую очередь заключить оборонительный союз со старыми друзьями."
RUS_FRA_desc:0 "Франция является одним из наших старый друзей. Нам стоит акцентировать на них свое внимание."
RUS_FRA_learn_ww1_desc:0 "Француская армия является отличным примером дисциплинированной армии. Скопировав их модель мы сможем восоздать модель их армии."
RUS_ENG_desc:0 "Великобритания является нашим товарищем в первой мировой войне. Никто не будет спорить с доминацией британской короны на море. Получив от них помощь в виде аренды судостроитьных верфей, мы сможем остроить российский флот."
RUS_ENG_dockyard_desc:0 "Изучив тчательно как устроены корабли Великобритании, мы сможем намного быстрее вернуть свое господство над Черный и Балтийским морем!"
RUS_USA_desc:0 "США очень сильно обязана нам в своем существованием. Именно наша императрица поддержала амереканских сепаратистов в борьбе с Англией свойе политикой 'Вооруженного нейтралитета'. Стоит напомнить им о нашей дружбе."
RUS_USA_planers_desc:0 "В современной войне основной аспект стоит сделать на господство в воздухе!"
RUS_no_step_back_desc:0 "И тихо капает из крана. И жизнь растрёпана, как блядь. Выходит, как бы, из тумана .И видит: тумбочка, кровать. И я пытаюсь приподняться. Хочу в глаза ей поглядеть. Взглянуть в глаза и разрыдаться. И никогда не умереть, никогда не умереть. Никогда не умереть, никогда не умереть."


RUS_ECONOMI:0 "СНГ пространство"
RUS_ECONOMI_desc:0 "СНГ - содружество независимых государств. Это отличная возможность для многих народов России реализовать национальные экономические проекты в свободной рыночной системе в отсутвии конкуренции извне."


