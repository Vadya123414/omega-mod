 LOADING_TIP_301: "«Эта война между нашими народами – трагическая ошибка. Рано или поздно она закончится, и было бы хорошо, если бы мы с вами смогли как-нибудь встретиться, да?»\n— Дятленко (немецкому солдату в Сталинграде)"
