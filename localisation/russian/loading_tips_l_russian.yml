 LOADING_TIP_240: "«Человек не имеет права убивать своего брата. То, что он делает это в мундире, не является оправданием: он лишь добавляет гнусность рабства к преступлению убийства»\n— Перси Биш Шелли"
 LOADING_TIP_241: "«Всякий, кто хоть раз заглянул в стекленеющие глаза солдата, умирающего на поле боя, хорошо подумает, прежде чем начать войну»\n— Отто фон Бисмарк"
 LOADING_TIP_242: "«Войны обычно приводят к ускорению исторического процесса»\n— Питер Гейл"
 LOADING_TIP_243: "«Война - не приключение. Война - болезнь. Как тиф»\n— Антуан де Сент-Экзюпери"
 LOADING_TIP_244: "«Дуче нужна Эфиопия, и он её получит. А с эфиопами или без них - это уже вопрос второстепенный»\n— Родольфо Грациани"
 LOADING_TIP_245: "«Прощённый враг опаснее тысячи врагов»\n— Родольфо Грациани"
 LOADING_TIP_246: "«Демократия прекрасна в теории; на практике это заблуждение. Когда-нибудь вы в Америке это увидите»\n— Бенито Муссолини"
 LOADING_TIP_247: "«Раса? Это чувство, а не реальность: по крайней мере, девяносто пять процентов - это чувство. Ничто и никогда не заставит меня поверить, что сегодня можно доказать существование биологически чистых рас»\n— Бенито Муссолини"
 LOADING_TIP_248: "«Никогда, никогда, никогда не верьте, что любая война будет гладкой и лёгкой, или что любой, кто отправится в это странное путешествие, сможет измерить приливы и ураганы, с которыми он столкнётся»\n— Уинстон Черчилль"
 LOADING_TIP_249: "«Двигатель танка — такое же его оружие, как и его пушка»\n— Гейнц Гудериан"
 LOADING_TIP_250: "«Мы сильно недооценили русских, размеры страны и измену климата. Это месть реальности»\n— Гейнц Гудериан, 1943"
 LOADING_TIP_251: "«Это второй случай в нашей истории, когда из Германии на Даунинг-стрит возвращается мир с честью. Я верю, что это мир для нашего времени»\n— Невилл Чемберлен, 1938"
