 LOADING_TIP_255: "«Теперь для нас невозможно проиграть войну: у нас есть союзник (Япония), который никогда не был побеждён за три тысячи лет»\n— Адольф Гитлер"
 LOADING_TIP_256: "«Сохрани людей, потеряв землю — землю можно вернуть. Сохрани землю, потеряв людей — останешься и без людей, и без земли.»\n— Мао Цзэдун, 1939"
 LOADING_TIP_257: "«Политика — это война без кровопролития, в то время как война — это политика с кровопролитием»\n— Мао Цзэдун, 1938"
