l_russian:
 LOADING_TIP_0: "«Унизительно сидеть сложа руки, когда другие пишут историю. И неважно, кто победит»\n—  Бенито Муссолини"
 LOADING_TIP_1: "«Для того, чтобы сделать народ великим, необходимо направить его в самую гущу битвы, даже если для этого придется дать ему пинка в зад. Именно это я и сделаю»\n—  Бенито Муссолини"
 LOADING_TIP_2: "«Каждый солдат, прежде чем идти в бой, должен понимать, как маленькая битва, в которой он участвует, соотносится с общей картиной»\n—  Бернард Л. Монтгомери"
 LOADING_TIP_3: "«Если мы проиграем войну в воздухе, мы проиграем войну вообще и проиграем её быстро»\n—  Бернард Л. Монтгомери"
 LOADING_TIP_4: "«Доверять другим - это хорошо, но гораздо лучше не доверять»\n—  Бенито Муссолини"
 LOADING_TIP_5: "«С точки зрения философии и доктрины я не верю в вечный мир»\n—  Бенито Муссолини"
 LOADING_TIP_6: "«Я предвижу, что Россия когда-нибудь будет иметь в своих руках всю Европу»\n—  Пётр 1"
 LOADING_TIP_7: "«Пока существуют суверенные государства, обладающие мощными армиями, война неизбежна»\n—  Альберт Эйнштейн"
 LOADING_TIP_8: "«Важно не как голосуют, а как считают»\n—  Иосиф Сталин"
 LOADING_TIP_9: "«История показывает, что непобедимых армий нет и не бывало»\n—  Иосиф Сталин"
 LOADING_TIP_10: "«Папа Римский? А сколько у него дивизий?»\n—  Иосиф Сталин"
 LOADING_TIP_11: "«Радость жизни - это то, что отличает советский народ»\n—  Иосиф Сталин"
 LOADING_TIP_12: "Единственная реальная сила - это самая большая пушка»\n—  Иосиф Сталин"
 LOADING_TIP_13: "«Союз, который не ставит себе целью войну, бессмыслен и бесполезен»\n—  Адольф Гитлер"
 LOADING_TIP_14: "«Великие лжецы - это и великие волшебники»\n—  Адольф Гитлер"
 LOADING_TIP_15: "«И если сегодня я стою здесь как революционер, то как революционер, восставший против революции»\n—  Адольф Гитлер"
 LOADING_TIP_16: "«Люди скорее поверят большой лжи, нежели маленькой; а если повторять её достаточно часто, рано или поздно люди поверят в неё»\n—  Адольф Гитлер"
 LOADING_TIP_17: "«Германия либо станет мировой державой, либо перестанет существовать»\n—  Адольф Гитлер"
 LOADING_TIP_18: "«Успех - это умение двигаться от одной неудачи к другой, не теряя энтузиазма»\n—  Уинстон Черчилль"
 LOADING_TIP_19: "«Успех - не окончателен, неудачи - не фатальны, значение имеет лишь мужество продолжать»\n—  Уинстон Черчилль"
 LOADING_TIP_20: "«Лучший аргумент против демократии - пятиминутный разговор с обычным избирателем»\n—  Уинстон Черчилль"
 LOADING_TIP_21: "«Основные битвы на полях будущих сражений будут вестись танковыми войсками»\n—  Хайнц Гудериан"
 LOADING_TIP_22: "«Новые немецкие «Пантеры» и «Тигры» следует использовать до первой поломки и не пытаться чинить. У них негодные двигатели, трансмиссия и подвеска»\n—  Управление по боевой подготовке Красной армии"
 LOADING_TIP_23: "«Ни один шельмец никогда не одерживал победу в войне, погибая за свое отечество. Он одерживал победу, заставляя другого беднягу погибнуть за свое отечество»\n—  Джордж С. Паттон"
 LOADING_TIP_24: "«Хороший план сегодня лучше безупречного плана завтра»\n—  Джордж С. Паттон"
 LOADING_TIP_25: "«Ведите меня, идите за мной или убирайтесь с моего пути»\n—  Джордж С. Паттон"
 LOADING_TIP_26: "«Ни одна оборона никогда не приносила успеха, нужно только атаковать, атаковать и ещё раз атаковать»\n—  Джордж С. Паттон"
 LOADING_TIP_27: "«В войне используют оружие, но выигрывают войну люди. Дух человека, который ведет за собой других, и дух тех, кто идет за ним, обеспечивает победу»\n—  Джордж С. Паттон"
 LOADING_TIP_28: "«Когда я в первый раз увидел реактивный самолет, я его сбил»\n—  Чак Йегер, ВВС США"
 LOADING_TIP_29: "«Тео, это Генрих. Сбил два бомбардировщика. Не осталось боеприпасов, топливо на исходе. Иду на таран. Прощай, увидимся в Валгалле»\n—  Генрих Эрлер, люфтваффе"
 LOADING_TIP_30: "«Суть лидерства в том, чтобы выбирать хороших людей и помогать им делать то, что они умеют лучше всего»\n—  Честер У. Нимиц"
 LOADING_TIP_31: "«Может ли предложенная операция иметь успех? Относится ли это к области выполнимого, с учетом ресурсов и обеспечения?»\n—  Честер У. Нимиц"
 LOADING_TIP_32: "«При подготовке к сражению я всегда находил, что планы бесполезны, но планирование - обязательно»\n—  Дуайт Д. Эйзенхауэр"
 LOADING_TIP_33: "«Не то главное, сколько веса в боевом псе, а сколько в нем боевитости»\n—  Дуайт Д. Эйзенхауэр"
 LOADING_TIP_34: "«Само собой разумеется, что когда на карту поставлено выживание, возникает борьба между народами и разгораются никому не нужные войны»\n—  Хидеки Тодзё"
 LOADING_TIP_35: "«В схватке один на один побеждает тот, у кого на один патрон больше»\n—  Эрвин Роммель"
 LOADING_TIP_36: "«Я лучше буду молотом, чем наковальней»\n—  Эрвин Роммель"
 LOADING_TIP_37: "«Пот экономит кровь, кровь сохраняет жизни, а мозги сохраняют и то и другое»\n—  Эрвин Роммель"
 LOADING_TIP_38: "«Бедный Невилл Чемберлен считал, что может доверять Гитлеру. Он ошибался. Но я не думаю, что ошибаюсь насчет Сталина»\n—  Уинстон Черчилль (после Ялты)"
 LOADING_TIP_39: "«Я уверен, что мы обеспечили прочный мир»\n—  Невилл Чемберлен, 1938 год, после Мюнхенского соглашения"
 LOADING_TIP_40: "«Ни один вражеский бомбардировщик не долетит до Рура. Если хоть один долетит, тогда я больше не Геринг. Можете называть меня Майером»\n—  Герман Геринг"
 LOADING_TIP_41: "«Нам нужно только пнуть дверь - и всё гнилое строение рухнет»\n—  Адольф Гитлер про Советский Союз"
 LOADING_TIP_42: "«Я могу без проблем вести войну с США и Великобританией от полугода до года. Сверх этого у меня нет надежды на успех»\n—  Исороку Ямамото"
 LOADING_TIP_43: "«Подходя к минному полю, наша пехота проводит атаку так, как будто этого поля нет»\n—  Георгий Жуков"
 LOADING_TIP_44: "«Мы недооценили русского колосса... лишившись дюжины дивизий, русские просто выставляют ещё дюжину»\n—  Франц Гальдер"
 LOADING_TIP_45: "«Немецкому командующему: ЧЕРТА С ДВА!\nАмериканский командующий»\n—  Энтони К. Маколифф в ответ на требование немцев о капитуляции"
 LOADING_TIP_46: "«Сегодня это мы. Завтра это будете вы»\n—  Хайле Селассие I, 1936 год"
 LOADING_TIP_47: "«Ни шагу назад!»\n—  Приказ по советской армии номер 227"
 LOADING_TIP_48: "«Тора! Тора! Тора!»\n—  Мицуо Футида, 7 декабря 1941 года"
 LOADING_TIP_49: "«Имя твое неизвестно. Подвиг твой бессмертен»\n—  Могила неизвестного солдата (Москва)"
 LOADING_TIP_50: "«Где, повторяю, где оперативное соединение тридцать четыре? Весь мир недоумевает»\n—  Адмирал Нимиц, ГК ВС США, сражение в заливе Лейте"
 LOADING_TIP_51: "«Военная ситуация обернулась не вполне к пользе Японии»\n—  Император Хирохито, 1945 год"
 LOADING_TIP_52: "«Нам надо было проявить больше благоразумия после первой войны»\n—  Герд фон Рундштедт"
 LOADING_TIP_53: "«Просторы России нас поглощают»\n—  Герд фон Рундштедт"
 LOADING_TIP_54: "«Я спрашиваю вас: хотите ли вы тотальную войну? Если потребуется, хотите ли вы более тотальную и радикальную войну, чем вы вообще можете сегодня представить?»\n—  Йозеф Геббельс"
 LOADING_TIP_55: "«Один удар немецкой армии и один удар советской армии покончат с этим уродливым детищем Версальского договора»\n—  Вячеслав Молотов (после падения Польши)"
 LOADING_TIP_56: "«Вычеркивайте авианосец! Диксон в штаб: вычеркивайте один авианосец!»\n—  Роберт E. Диксон, сражение в Коралловом море"
 LOADING_TIP_57: "«Разве не ужас? Вот мы, два офицера германского генштаба, обсуждаем, как лучше прикончить нашего главнокомандующего»\n—  Хеннинг фон Тресков"
 LOADING_TIP_58: "«Гитлер - это пляшущий дервиш. Его следует пристрелить»\n—  Хеннинг фон Тресков"
 LOADING_TIP_59: "«Нацисты вступили в этой войну с довольно детской иллюзией, что они смогут разбомбить всех, и никто не станет бомбить их в ответ»\n—  Артур «Бомбардировщик» Харрис"
 LOADING_TIP_60: "«Если бы Гитлер вторгся в ад, я бы по крайней мере замолвил за дьявола словечко в Палате общин»\n—  Уинстон Черчилль, 21 июня 1941 года"
 LOADING_TIP_61: "«Так что, мерзавец мертв? Жаль, мы не взяли его живым!»\n—  Иосиф Сталин (после известия о самоубийстве Гитлера)"
 LOADING_TIP_62: "«Мы разгромлены. Мы побеждены, мы проиграли бой»\n—  Поль Рейно, 15 мая 1940 года"
 LOADING_TIP_63: "«Мне нужно всего пару тысяч погибших, чтобы я мог заседать на мирной конференции как человек, который сражался»\n—  Бенито Муссолини"
 LOADING_TIP_64: "«Французы солгали полякам, пообещав, что пойдут в атаку»\n—  Эдмунд Айронсайд"
 LOADING_TIP_65: "«Зачем умирать за Данциг?»\n—  Французский антивоенный лозунг, 1939 год"
 LOADING_TIP_66: "«Что-то есть в этой войне фальшивое»\n—  Уильям Бора, сенатор США, 1939 год"
 LOADING_TIP_67: "«Народ и политическая система Швейцария отвратительны и ничтожны. Швейцарцы - это смертельные враги новой Германии»\n—  Адольф Гитлер"
 LOADING_TIP_68: "«Мы слишком быстро вкусили плоды победы»\n—  Император Хирохито"
 LOADING_TIP_69: "«Все вы закончите тем, что станете чистить немцам ботинки!»\n—  Итало Бальбо"
 LOADING_TIP_70: "«Топите, жгите и уничтожайте, не пропускайте никого»\n—  Эндрю Каннингем, битва за Тунис"
 LOADING_TIP_71: "«Мне кажется, с мостами мы не рассчитали»\n—  Фредерик Браунинг (перед операцией «Маркет Гарден»)"
 LOADING_TIP_72: "«Спасибо Господу за французскую армию»\n—  Уинстон Черчилль, 1933 год"
 LOADING_TIP_73: "«Когда видишь гремучую змею, которая изготовилась для броска, не жди, пока она укусит - раздави ее»\n—  Франклин Д. Рузвельт"
 LOADING_TIP_74: "«Правила не обязательно священны, а вот принципы - да»\n—  Фрэнклин Д. Рузвельт"
 LOADING_TIP_75: "«Голодающие и безработные - вот лучший материал, из которого рождается диктатура»\n—  Франклин Д. Рузвельт"
 LOADING_TIP_76: "«Человек всегда должен быть настороже, если хочет жить. Иначе какой-нибудь немецкий сукин сын подкрадется сзади и забьет его насмерть носком с дерьмом»\n—  Джордж С. Паттон"
 LOADING_TIP_77: "«Укрепления, артиллерия, иностранная помощь будут бесполезны, если рядовой солдат не будет знать, что это ОН защищает свою страну»\n - Карл Густав Эмиль Маннергейм"
 LOADING_TIP_78: "Через грязь и кровь к зеленым лугам вдали.\n– Девиз Королевских бронетанковых войск Канады"
 LOADING_TIP_79: "«Британскому штабу ВМС крайне интересно узнать, смогли ли итальянцы вернуться на уровень предыдущей войны или совсем отошли от дел»\n - Уинстон Черчилль (после объявления войны Италией)"
 LOADING_TIP_80: "«И мы будем бороться с ними донышками разбитых пивных бутылок, потому что это всё, что у нас есть!»\n - Уинстон Черчилль (сразу после речи «Мы будем сражаться на пляжах»)"
 LOADING_TIP_81: "«Опыт показывает, что атаки на бронетехнику с оружием ближнего боя практически обречены на успех при должном уровне упорства»\n - Инструкция по борьбе с танками, группа армий «Центр»"
 LOADING_TIP_82: "«Дайте мне пятьдесят DC-3, и японцы могут забирать Бирманскую дорогу»\n - Чан Кайши"
 LOADING_TIP_83: "«Политика - это война без кровопролития, в то время как война - это политика с кровопролитием»\n - Мао Цзэдун"
 LOADING_TIP_84: "«Сохрани людей, потеряв землю - землю ещё можно захватить. Сохрани землю, потеряв людей - останешься и без людей, и без земли»\n - Мао Цзэдун"
 LOADING_TIP_85: "«Я охотнее умру в великой Румынии, чем в раю маленькой Румынии»\n - Йон Антонеску"
 LOADING_TIP_86: "«Люди не важны - важно то, что они представляют»\n - Йон Антонеску"
 LOADING_TIP_87: "«В военное время правда является такой драгоценностью, что её всегда должен охранять целый отряд лжи»\n— Уинстон Черчилль"
 LOADING_TIP_88: "«Поражённые сегодня механической силой, мы сможем в будущем победить при помощи превосходящей механической силы. Судьба мира зависит от этого»\n— Шарль де Голль"
 LOADING_TIP_89: "«Долгие песни скрипки осенней. Зов неотвязный сердце мне ранит»\n— Зашифрованное радиосообщение УСО французскому Сопротивлению"
 LOADING_TIP_90: "«Дальнейшее существование такого государства, как Швейцария, просто недопустимо. Это гнойный прыщ на лице Европы»\n— Адольф Гитлер"
 LOADING_TIP_91: "«Германия либо станет мировой державой, либо перестанет существовать»\n— Адольф Гитлер"
 LOADING_TIP_92: "«Чем бы ваши люди предпочли быть - уставшими или мертвыми?»\n— Эрвин Роммель"
 LOADING_TIP_93: "«Я видел войну... Я ненавижу войну»\n— Франклин Д. Рузвельт"
 LOADING_TIP_94: "«Сила - единственный язык, который они понимают»\n— Франклин Д. Рузвельт"
 LOADING_TIP_95: "«Как только мы получим власть, мы никогда больше не откажемся от неё, если только нас не вынесут как трупы из наших кабинетов.»\n— Йозеф Геббельс"
 LOADING_TIP_96: "«Берлин сообщил Отту, что немецкое наступление начнётся в конце июня. Отт на 95% уверен, что война начнётся»\n— Рихард Зорге (в докладе в Москву в мае 1941 года, отклонённом Сталиным)"
 LOADING_TIP_97: "«Это зло, против которого мы будем бороться - грубая сила, недобросовестность, несправедливость, угнетение и преследование»\n— Невилл Чемберлен"
 LOADING_TIP_98: "«Без кораблей мы не можем жить»\n— Уинстон Черчилль"
 LOADING_TIP_99: "«Это должен быть мир без победы. Победа означала бы мир, навязанный проигравшему, условия победителя, навязанные побежденному.»\n— Вудро Вильсон"
 LOADING_TIP_100: "«Народ, который не знает своей истории, есть народ без будущего»\n— Екатерина 2"
 LOADING_TIP_101: "«Логистика – это кандалы и оковы танковой войны»\n— Хайнц Гудериан"
 LOADING_TIP_102: "«Хочешь мира - готовься к войне»\n— Сэр Бэзил Лидделл-Харт"
 LOADING_TIP_103: "«Вы можете не интересоваться войной, но тогда война заинтересуется вами.»\n— Лев Троцкий"
 LOADING_TIP_104: "«Все войны будут решены морской мощью»\n— Эрих Редер"
 LOADING_TIP_105: "«Смертельно опасно вступать в войну, не желая победить в ней»\n— Дуглас Макартур"
 LOADING_TIP_106: "«Мир невозможно удержать силой. Его можно достичь лишь пониманием»\n— Альберт Эйнштейн"
 LOADING_TIP_107: "«Мой девиз: ‘Уничтожай его всеми возможными средствами’. Именно я буду вести войну!»\n— Адольф Гитлер"
 LOADING_TIP_108: "«Великие вещи, все, как одна: Женщины, Лошади, Власть и Война»\n— Редьярд Киплинг"
 LOADING_TIP_109: "«То, за что человек готов умереть, не обязательно правильное»\n— Оскар Уайльд"
 LOADING_TIP_110: "«Всякая война основана на обмане»\n— Сунь Цзы"
 LOADING_TIP_111: "«В глазах строителей империи люди не люди, а инструменты»\n— Наполеон Бонапарт"
 LOADING_TIP_112: "«Никогда не наноси врагу незначительного ущерба»\n— Никколо Макиавелли"
 LOADING_TIP_113: "«Высшее искусство войны - покорить врага, не сражаясь с ним»\n— Сунь Цзы"
 LOADING_TIP_114: "«Настоящие победы - это победы мира, а не войны»\n— Ральф Уолдо Эмерсон"
 LOADING_TIP_115: "«Все войны ведутся ради приобретения богатства»\n— Сократ"
 LOADING_TIP_116: "«Просто поверженный враг может воскреснуть, но примирившийся враг действительно побеждён»\n— Иоганн Кристоф фон Шиллер"
 LOADING_TIP_117: "«Государственный деятель, поддавшийся военной лихорадке, должен понимать, что как только дан сигнал. Он больше не хозяин политики, а раб непредсказуемых и неконтролируемых событий»\n— Уинстон Черчилль"
 LOADING_TIP_118: "«Война не делает из мальчиков мужчин, она делает из мужчин мертвецов»\n— Кен Гиллеспи"
 LOADING_TIP_119: "«Граница России нигде не заканчивается»\n— Путин"
 LOADING_TIP_120: "«Войны учат нас не любить врагов, а ненавидеть союзников»\n— У. Л. Джордж"
 LOADING_TIP_121: "«Политика - это чрево, в котором рождается война»\n— Карл фон Клаузевиц"
 LOADING_TIP_122: "«У России есть только два союзника - ёё армия и флот»\n— Александр 3"
 LOADING_TIP_123: "«Нации, как и отдельные люди, наказываются за свои проступки»\n— Улисс Грант"
 LOADING_TIP_124: "«Мир - опасное место не из-за тех, кто творит зло, а из-за тех, кто смотрит и ничего не делает»\n— Альберт Эйнштейн"
 LOADING_TIP_125: "«Или война устарела, или люди»\n— Р. Бакминстер Фуллер"
 LOADING_TIP_126: "«В мире мир сын хоронит отца, а в войне - отец хоронит сына»\n— Крез"
 LOADING_TIP_127: "«Все народы хотят мира, но они хотят мира, который им удобен»\n— Сэр Джон Фишер"
 LOADING_TIP_128: "«Вера в возможность короткой решающей войны - одна из самых древних и опасных человеческих иллюзий»\n— Роберт Линд"
 LOADING_TIP_129: "«Дерево свободы должно время от времени орошаться кровью патриотов и тиранов»\n— Томас Джефферсон"
 LOADING_TIP_130: "«Человек может умереть, нации могут возвышаться и падать, но идея продолжает жить»\n— Джон Ф. Кеннеди"
 LOADING_TIP_131: "«Лидер ведёт свою страну вперёд своим примером, а не силой»\n— Сунь Цзы"
 LOADING_TIP_132: "«Пусть ваши планы будут тёмны и непроницаемы, как ночь, и когда вы двигаетесь, падайте, как молния»\n— Сунь Цзы"
 LOADING_TIP_133: "«Человечество должно положить конец войне - или война положит конец человечеству»\n— Джон Ф. Кеннеди"
 LOADING_TIP_134: "«Можно построить трон из штыков, но долго на нём не просидишь»\n— Борис Ельцин"
 LOADING_TIP_135: "«Война не проиграна, пока вы не считаете её проигранной»\n— Эрих фон Манштейн"
 LOADING_TIP_136: "«Нельзя вести переговоры с тигром, когда твоя голова в его пасти!»\n— Уинстон Черчилль"
 LOADING_TIP_137: "«История ненадолго поручает заботу о свободе слабым или робким»\n— Дуайт Эйзенхауэр"
 LOADING_TIP_138: "«По тщательному мнению всех нас здесь... возможность (Японии) нанести удар, которая существовала до недавнего времени, исчезла»\n— Рихард Зорге, советский шпион"
 LOADING_TIP_139: "«В войне побеждает не тот, кто прав, а тот, кто остался в живых»\n— Золтан Батори"
 LOADING_TIP_140: "«Пусть у нас будет кинжал в зубах, бомба в руках и бесконечное презрение в сердцах»\n— Бенито Муссолини"
 LOADING_TIP_141: "«Истина в том, что люди устали от свободы»\n— Бенито Муссолини"
 LOADING_TIP_142: "«Только кровь приводит в движение колеса истории»\n— Бенито Муссолини"
 LOADING_TIP_143: "«Будем твёрды, чисты и верны; в конце нашей печали есть величайшая слава мира, слава людей, которые не сдались»\n— Шарль де Голль"
 LOADING_TIP_144: "«Меч - ось мира, и величие не может быть разделено»\n— Шарль де Голль"
 LOADING_TIP_145: "«Лидер всегда одинок перед лицом плохой судьбы»\n— Шарль де Голль"
 LOADING_TIP_146: "«Нравится вам или нет, но история на нашей стороне. Мы вас похороним»\n— Никита Хрущёв"
 LOADING_TIP_147: "«Если танки преуспеют, то последует победа»\n— Гейнц Гудериан"
 LOADING_TIP_148: "«Чем больше людей убиваешь, тем более революционен»\n— Мао Цзэдун"
 LOADING_TIP_149: "«Без армии для народа нет ничего для народа»\n— Мао Цзэдун"
 LOADING_TIP_150: "«Немецкие генералы идут не на смерть, а в плен»\n— Советский пропагандистский плакат (после Сталинградской битвы)"
 LOADING_TIP_151: "«Всякая революция лишь тогда чего-нибудь стоит, если она умеет защищаться»\n— Владимир Ленин"
 LOADING_TIP_152: "«История повторяется дважды: первый раз в виде трагедии, второй - в виде фарса»\n— Карл Маркс"
 LOADING_TIP_153: "«История будет ко мне благосклонна, ибо я намерен её написать»\n— Уинстон Черчилль"
 LOADING_TIP_154: "«Одной из форм одурачения рабочего класса является пацифизм и абстрактная проповедь мира»\n— Владимир Ленин"
 LOADING_TIP_155: "«Угнетение - суть власти»\n— Эрнст Кальтенбруннер"
 LOADING_TIP_156: "«Мы ничему не учимся у истории»\n— Джордж Бернард Шоу"
 LOADING_TIP_157: "«Кто забывает уроки истории, обречён на их повторение»\n— Джордж Сантаяна"
 LOADING_TIP_158: "«Немецкая армия - машина, а машины можно сломать!»\n— Константин Рокоссовский"
 LOADING_TIP_159: "«Покажите мне человека - и я найду в нём преступление»\n— Лаврентий Берия"
 LOADING_TIP_160: "«Герой не храбрее обычного человека, он просто храбрее на пять минут дольше»\n— Ральф Уолдо Эмерсон"
 LOADING_TIP_161: "«Наша величайшая слава не в том, чтобы никогда не падать, а в том, чтобы подниматься каждый раз, когда мы падаем»\n— Ральф Уолдо Эмерсон"
 LOADING_TIP_162: "«Все войны - гражданские, потому что все люди братья»\n— Франсуа Фенелон"
 LOADING_TIP_163: "«Никогда не думайте, что война, какой бы необходимой или оправданной она ни была, не является преступлением»\n— Эрнест Хемингуэй"
 LOADING_TIP_164: "«Нет ни благородного способа убивать, ни мягкого способа разрушать. В войне нет ничего хорошего»\n— Авраам Линкольн"
 LOADING_TIP_165: "«Цель войны не в том, чтобы умереть за свою страну, а в том, чтобы заставить другого ублюдка умереть за свою»\n— Джордж С. Паттон"
 LOADING_TIP_166: "«Кто не жалеет о распаде СССР, у того нет сердца»\n— Путин"
 LOADING_TIP_167: "«Война не определяет, кто прав, определяет только, кто остался»\n— Бертран Рассел"
 LOADING_TIP_168: "«Смерть одного человека - трагедия, смерть миллионов - статистика»\n— Курт Тухольский"
 LOADING_TIP_169: "«Смерть решает все проблемы - нет человека, нет проблемы»\n— Анатолий Рыбаков"
 LOADING_TIP_170: "«В Советской армии для отступления требуется больше мужества, чем для наступления»\n— Иосиф Сталин"
 LOADING_TIP_171: "«Если оппозиция разоружится, всё будет хорошо. Если она откажется разоружиться, мы сами её разоружим»\n— Иосиф Сталин"
 LOADING_TIP_172: "«Тот, кто сегодня кровь со мной прольёт, мне станет братом: как бы ни был низок, его облагородит этот день»\n— Уильям Шекспир"
 LOADING_TIP_173: "«Наш мир - это мир ядерных гигантов и этических младенцев. Мы знаем больше о войне, чем о мире; о том, как убивать, чем о том, как жить»\n— Омар Брэдли"
 LOADING_TIP_174: "«Битвы выигрываются кровью и манёвром. Чем великий генерал, тем больше он полагается на маневр и меньше на кровопролитие»\n— Уинстон Черчилль"
 LOADING_TIP_175: "«Мы защитим наш остров любой ценой. Мы будем сражаться на пляжах, на высадочных площадках, в полях, на улицах и на холмах. Мы никогда не сдадимся!»\n— Уинстон Черчилль"
 LOADING_TIP_176: "«Я не знаю, является ли война интерлюдией во время мира, или мир - интерлюдией во время войны»\n— Жорж Клемансо"
 LOADING_TIP_177: "«Политики везде одинаковы: они обещают построить мост там, где и реки-то нет»\n— Никита Хрущёв"
 LOADING_TIP_178: "«Пусть тем, кто принимает свою судьбу, будет даровано Счастье, пусть тем, кто бросает вызов своей судьбе, будет дарована Слава»\n— Эдель, принцесса Туту"
 LOADING_TIP_179: "«Часть общей схемы ошибочной политики, что наша страна теперь настроена на экономику вооружений, порожденную искусственно вызванной психозой военной истерии и подпитываемую непрерывной пропагандой страха»\n— Генерал Дуглас Макартур, 15 мая 1951"
 LOADING_TIP_180: "«Сегодня у нас поколение людей, воспитанных в вере в эволюцию, которая утверждает, что права исходят от правительства»\n— Кент Ховинд"
 LOADING_TIP_181: "«Все животные равны, но некоторые животные равнее других»\n— Джордж Оруэлл (аллегорически о СССР) в романе 'Скотный двор'"
 LOADING_TIP_182: "«Прогуливаться по разрушенным городам Германии - значит испытывать настоящее сомнение в преемственности цивилизации»\n— Джордж Оруэлл"
 LOADING_TIP_183: "«Если вам нужен образ будущего, вообразите сапог, топчущий лицо человека - вечно. И помните, что это - навечно»\n— Джордж Оруэлл"
 LOADING_TIP_184: "«Война - это мир. Свобода - это рабство. Невежество - сила»\n— Джордж Оруэлл"
 LOADING_TIP_185: "«Война есть война. Единственный хороший человек - мёртвый»\n— Джордж Оруэлл"
 LOADING_TIP_186: "«Мы не должны быть врагами. Хотя страсть может быть напряженной, она не должна разорвать наши узы привязанности. Мистические струны памяти набухнут, когда к ним снова прикоснутся лучшие ангелы нашей природы»\n— Авраам Линкольн"
 LOADING_TIP_187: "«Дом, разделившийся сам в себе, не устоит»\n— Авраам Линкольн"
 LOADING_TIP_188: "«Если движется - салютуй. Если не движется - подними. А если не можешь поднять - покрась»\n— Аноним (пословица 1940-х)"
 LOADING_TIP_189: "«Сдавлен справа. Центр поддается. Маневр невозможен. Ситуация отличная. Я атакую»\n— Фердинанд Фош (на Марнской битве)"
 LOADING_TIP_190: "«Это не мир. Это перемирие на двадцать лет»\n— Фердинанд Фош, 1919"
 LOADING_TIP_191: "«Мы в Польше не знаем концепции мира любой ценой. В жизни людей, народов и стран есть лишь одна вещь без цены - честь!»\n— Юзеф Бек, министр иностранных дел Польши, 5 мая 1939"
 LOADING_TIP_192: "«Быть побеждённым и не поддаваться - это победа, победить и почивать на лаврах - это поражение»\n— Юзеф Пилсудский"
 LOADING_TIP_194: "«Вчера, 7 декабря, дата, которая войдет в историю позором, США внезапно и целенаправленно были атакованы военно-морскими и воздушными силами Японской империи»\n— Франклин Д. Рузвельт"
 LOADING_TIP_193: "«Лучше прожить один день львом, чем сто лет овцой»\n— Бенито Муссолини"
 LOADING_TIP_195: "«Глупо и неправильно оплакивать погибших людей. Скорее, мы должны благодарить Бога за то, что такие люди жили»\n— Джордж С. Паттон Мл."
 LOADING_TIP_196: "«От Штеттина на Балтике до Триеста на Адриатике, через весь континент, был опущен «железный занавес»\n— Уинстон Черчилль"
 LOADING_TIP_197: "«Я думаю о тебе и нашем маленьком сыне. Единственное, что у меня осталось - думать о тебе. Мне все остальное безразлично. Думать о тебе рвёт мне сердце»\n— Неизвестный немецкий солдат в окружении Сталинграда (его последнее письмо)"
 LOADING_TIP_198: "«Мы пасём овец, мы ведём скот, мы командуем людьми. Ведите меня, или следуйте за мной - или прочь с моей дороги»\n— Джордж С. Паттон"
 LOADING_TIP_199: "«Не позволяй ублюдкам тебя сломать»\n— Джозеф Уоррен Стилуэлл"
 LOADING_TIP_200: "«Нельзя устроить авианалёт без бомб!»\n— Джозеф Уоррен Стилуэлл"
 LOADING_TIP_201: "«Командовать танковой дивизией может любой толковый офицер, но, чтобы снабжать её, нужен гений»\n— Хассо Эккард фон Мантейфель"
 LOADING_TIP_202: "«Я думаю, это хорошая идея»\n— Махатма Ганди (о британской цивилизации)"
 LOADING_TIP_203: "«В целом наших генералов перегенералили»\n— Джон Адамс"
 LOADING_TIP_204: "«Я не знаю, каким оружием будет вестись Третья мировая война, но Четвёртая мировая война будет вестись палками и камнями»\n— Альберт Эйнштейн"
 LOADING_TIP_205: "«Обычно солдаты выигрывают сражения, а генералам достаются почести»\n— Наполеон Бонапарт"
 LOADING_TIP_206: "«Победоносные итальянские войска сегодня на рассвете пересекли греко-албанскую границу!»\n— Бенито Муссолини (Адольфу Гитлеру), 28 октября 1940"
 LOADING_TIP_207: "«Среди людей, сражавшихся на Иводзиме, необычайная доблесть была общей добродетелью»\n— адмирал флота США Честер У. Нимиц, 16 марта 1945"
 LOADING_TIP_208: "«Атаки на города стратегически оправданы, поскольку они, как правило, сокращают войну и тем самым сохраняют жизни солдат союзников»\n— Артур «Бомбер» Харрис, 29 марта 1945"
 LOADING_TIP_209: "«Именно в этот прекрасный день мы празднуем день рождения Фюрера и благодарим его за то, что он - единственная причина, по которой Германия до сих пор жива»\n— Йозеф Геббельс, 20 апреля 1945"
 LOADING_TIP_210: "«Технический прогресс - это как топор в руках патологического преступника»\n— Альберт Эйнштейн"
 LOADING_TIP_211: "«Героизм по команде, бессмысленное насилие и весь отвратительный комплекс действий, которые творятся во имя патриотизма - как страстно я ненавижу всё это.»\n— Альберт Эйнштейн"
 LOADING_TIP_212: "«Совершайте все свои злодеяния сразу»\n— Никколо Макиавелли"
 LOADING_TIP_213: "«Оптимистичные офицеры учат английский, пессимисты - русский»\n— Немецкая шутка о Второй мировой войне"
 LOADING_TIP_214: "«Что лучше всего в жизни? Сокрушать своих врагов, видеть, как их гонят перед тобой ... и слышать плач их женщин»\n— Конан-варвар"
 LOADING_TIP_215: "«Имя твоё неизвестно, подвиг твой бессмертен»\n— Слова высеченные на Могиле Неизвестного Солдата"
 LOADING_TIP_216: "«Каждый коммунист должен усвоить ту истину, что винтовка рождает власть»\n— Мао Цзэдун"
 LOADING_TIP_217: "«Из моего гниющего тела вырастут цветы, и я буду в них, и это вечность»\n— Эдвард Мунк"
 LOADING_TIP_218: "«Я не могу предложить ничего, кроме крови, тяжёлого труда, слёз и пота»\n— Уинстон Черчилль"
 LOADING_TIP_219: "«Единственное, чего мы должны бояться, так это самого страха»\n— Франклин Д. Рузвельт"
 LOADING_TIP_220: "«Только мёртвые видели конец войны»\n— Плато"
 LOADING_TIP_221: "«Мы никогда не сдадимся, нет, никогда! Нас могут уничтожить, но, уничтоженные, мы увлечём за собой в пламени этот мир»\n— Адольф Гитлер"
 LOADING_TIP_222: "«Успех не окончателен, неудача не фатальна: важна смелость продолжать»\n— Уинстон Черчилль"
 LOADING_TIP_223: "«Не бывает хорошей войны или плохого мира»\n— Бенджамин Франклин"
 LOADING_TIP_224: "«Si vis pacem, para bellum»\n— Вегеций"
 LOADING_TIP_225: "«Veni, vidi, vici (Пришёл, увидел, победил)»\n— Юлий Цезарь"
 LOADING_TIP_226: "«Патриоты всегда говорят о том, чтобы умереть за свою страну, и никогда - чтобы убивать за неё»\n— Бертран Рассел"
 LOADING_TIP_227: "«Кто боится быть побеждённым, уверен в поражении»\n— Наполеон Бонапарт"
 LOADING_TIP_228: "«Нельзя сказать, что цивилизация не развивается - в каждой новой войне людей убивают новым способом»\n— Уилл Роджерс"
